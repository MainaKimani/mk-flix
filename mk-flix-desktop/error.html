<!doctype html>
<!--
  Shown when a cinejoy.pk page fails to load: by main.js in the desktop app,
  and by MainActivity from assets/ in the Android app. Both pass the failed
  page and the error as query parameters:
    ?url=<page that failed>&code=<net error code, if known>&desc=<ERR_... name>
  Retry goes back to that page (only cinejoy.pk pages are retried; anything
  else falls back to the home page).

  This file is shared: keep mk-flix-desktop/error.html and the Android
  app's assets/error.html identical.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src file:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blendy Play: Powered by CineJoy</title>
<style>
  :root {
    --bg: #0b0c10;
    --text: rgba(255, 255, 255, 0.88);
    --muted: rgba(255, 255, 255, 0.55);
    --faint: rgba(255, 255, 255, 0.3);
    --accent: #9be33c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: radial-gradient(ellipse at 70% 20%, #2a2418 0%, var(--bg) 60%);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Ubuntu, sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  main { max-width: 440px; text-align: center; }
  img { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { margin: 0 0 10px; font-size: 1.35rem; font-weight: 700; }
  p { margin: 0 0 10px; color: var(--muted); }
  button {
    margin-top: 18px;
    padding: 10px 28px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #111;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .detail { margin-top: 22px; font-size: 0.75rem; color: var(--faint); -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1 id="title">Can't reach cinejoy.pk</h1>
  <p id="message">Something went wrong loading the page.</p>
  <p id="hint"></p>
  <button id="retry" type="button">Retry</button>
  <div class="detail" id="detail"></div>
</main>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var code = Number(params.get('code')) || 0;
    var desc = params.get('desc') || '';
    var failed = params.get('url') || '';
    var HOME = 'https://cinejoy.pk/';

    // Only send Retry back to cinejoy.pk pages.
    var target = HOME;
    try {
      var host = new URL(failed).hostname;
      if (host === 'cinejoy.pk' || host.endsWith('.cinejoy.pk')) target = failed;
    } catch (e) { /* keep HOME */ }

    var title = document.getElementById('title');
    var message = document.getElementById('message');
    var hint = document.getElementById('hint');

    // Classify by Chromium's net error code (desktop passes it as-is) or by
    // the error's name, which Android passes in desc (its own error codes
    // are coarser): -106 / INTERNET_DISCONNECTED = offline; -200..-299 /
    // CERT_ / SSL = certificate; -100..-199, NAME_NOT_RESOLVED, CONNECTION_,
    // TIMED_OUT, ADDRESS_UNREACHABLE = connection.
    var name = desc.toUpperCase();
    var offline = code === -106 || /INTERNET_DISCONNECTED/.test(name);
    var cert = (code <= -200 && code > -300) || /CERT|SSL/.test(name);
    var connection = (code <= -100 && code > -200) ||
      /NAME_NOT_RESOLVED|CONNECTION_|TIMED_OUT|ADDRESS_UNREACHABLE|HOST_LOOKUP|CONNECT/.test(name);

    if (offline) {
      title.textContent = "You're offline";
      message.textContent = 'Blendy Play needs an internet connection.';
      hint.textContent = 'It will try again by itself when you reconnect.';
    } else if (cert) {
      message.textContent = 'Your network is blocking or inspecting the connection to cinejoy.pk.';
      hint.textContent = 'Work and school networks often block streaming sites. Try another network, such as a phone hotspot.';
    } else if (connection) {
      message.textContent = "The connection to cinejoy.pk failed or was blocked.";
      hint.textContent = 'Check your internet connection, or try another network.';
    }

    if (desc) document.getElementById('detail').textContent = desc + (code ? ' (' + code + ')' : '');

    function retry() { location.replace(target); }
    var button = document.getElementById('retry');
    button.addEventListener('click', retry);
    button.focus();
    window.addEventListener('online', retry);
  })();
</script>
</body>
</html>
